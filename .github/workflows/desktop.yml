# The desktop window and its browser pane, run live on each platform: the app opens on a test engine, the browser
# pane loads a real page, and the screenshots are kept as the run's evidence. Started by hand or by a release tag.
name: desktop
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq bubblewrap xvfb libgbm1 libnss3 libasound2t64
      - run: bun install --frozen-lockfile
      - run: npm ci --no-audit --no-fund
        working-directory: apps/desktop
      # npm skips install scripts here, so Electron's binary is fetched explicitly before the run.
      - run: node node_modules/electron/install.js
        working-directory: apps/desktop
      # Chromium's sandbox helper must be root-owned and setuid on Linux; fixed rather than turned off.
      - if: runner.os == 'Linux'
        run: sudo chown root:root node_modules/electron/dist/chrome-sandbox && sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
        working-directory: apps/desktop
      - run: bun run build:web
      - if: runner.os == 'Linux'
        run: xvfb-run -a bun scripts/desktop_smoke.ts dist/smoke
      - if: runner.os != 'Linux'
        run: bun scripts/desktop_smoke.ts dist/smoke
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}
          path: dist/smoke
          if-no-files-found: warn
