# Tests and type checks on the three platforms EnrichedLab ships for. Releases are built and signed on a maintainer's
# Mac (scripts/release.ts); this checks every push and pull request.
name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq bubblewrap
      - run: bun install --frozen-lockfile
      - run: bun test tests
      - run: bunx tsc -p tsconfig.json --noEmit
      - run: bun run check
        working-directory: packages/web
